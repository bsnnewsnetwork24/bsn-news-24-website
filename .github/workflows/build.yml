name: Build BSN News 24 APK & AAB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Accept Android SDK Licenses & Prepare Debug Keystore
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK_DIR/licenses/android-sdk-license"
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle testDebugUnitTest --no-configuration-cache

      - name: Build Debug APK & AAB
        run: gradle assembleDebug bundleDebug --no-configuration-cache

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BSN-News-24-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: BSN-News-24-AAB
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error

      - name: Build Signed Release APK & AAB (when secrets configured)
        if: env.STORE_PASSWORD != '' && env.KEY_PASSWORD != '' && hashFiles('my-upload-key.jks') != ''
        run: gradle assembleRelease bundleRelease --no-configuration-cache

      - name: Upload Signed Release APK
        if: env.STORE_PASSWORD != '' && env.KEY_PASSWORD != '' && hashFiles('app/build/outputs/apk/release/app-release.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: BSN-News-24-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Upload Signed Release AAB
        if: env.STORE_PASSWORD != '' && env.KEY_PASSWORD != '' && hashFiles('app/build/outputs/bundle/release/app-release.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: BSN-News-24-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
